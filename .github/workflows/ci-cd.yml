name: CI and GHCR delivery

on:
  push:
    branches: [fix-issue, main]
  pull_request:
    branches: [fix-issue, main]

permissions: {}

jobs:
  verify:
    if: >-
      !github.event.deleted &&
      github.head_ref != 'progress' && github.head_ref != 'backup-main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      OBSIDIAN_BACKEND_IMAGE: ghcr.io/peterphan2005/obsidian-compute-backend:${{ github.sha }}
      OBSIDIAN_FRONTEND_IMAGE: ghcr.io/peterphan2005/obsidian-compute-frontend:${{ github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Build candidate images from the checked-out commit
        run: |
          context_dir="$(mktemp -d "$RUNNER_TEMP/obsidian-build.XXXXXX")"
          git -C "$GITHUB_WORKSPACE" archive HEAD:source | tar -xf - -C "$context_dir"
          for component in backend frontend; do
            tag_var="OBSIDIAN_${component^^}_IMAGE"
            docker build --file "$context_dir/$component/Dockerfile" \
              --platform linux/amd64 --provenance=false \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "${!tag_var}" "$context_dir"
          done
      - name: Run full verification with candidate images
        run: npm run verify -- --images
      - name: Export verified images
        if: github.event_name == 'push' && github.repository == 'PeterPhan2005/Obsidian-compute'
        run: |
          docker save "$OBSIDIAN_BACKEND_IMAGE" "$OBSIDIAN_FRONTEND_IMAGE" |
            gzip > "$RUNNER_TEMP/verified-images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.repository == 'PeterPhan2005/Obsidian-compute'
        with:
          name: verified-images
          path: ${{ runner.temp }}/verified-images.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  publish:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.repository == 'PeterPhan2005/Obsidian-compute' &&
      (github.ref == 'refs/heads/fix-issue' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-images
          path: ${{ runner.temp }}
      - name: Push verified images and record registry digests
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker load --input "$RUNNER_TEMP/verified-images.tar.gz"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN

          printf '### Published images for `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          for component in backend frontend; do
            repository="ghcr.io/peterphan2005/obsidian-compute-$component"
            docker push "$repository:$GITHUB_SHA" | tee "$RUNNER_TEMP/$component-push.log"
            digest=$(sed -nE 's/.* digest: (sha256:[a-f0-9]{64}) .*/\1/p' "$RUNNER_TEMP/$component-push.log")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf -- '- `%s:%s` → `%s@%s`\n' "$repository" "$GITHUB_SHA" "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
