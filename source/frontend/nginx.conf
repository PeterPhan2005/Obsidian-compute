map $http_referer $referrer_origin {
  default "-";
  "~*^(?<public_origin>https?://[^/?#]+)" $public_origin;
}
log_format storefront '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$referrer_origin" "$http_user_agent"';

server {
  listen 80;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log storefront;
  location ~* ^/((checkout/success|reset-password)/?$|api/v1/checkout/receipts(?:/|$)) {
    # The original URI can still contain a credential from a legacy client.
    error_log /dev/null;
    access_log off;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    try_files /index.html =404;
  }
  location ~* ^/(oauth/google/?$|api/v1/auth/google/callback/?$) {
    access_log off;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /recommendation-assets/ {
    types {
      application/json json;
      text/plain md txt;
    }
    default_type application/octet-stream;
    try_files $uri =404;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
