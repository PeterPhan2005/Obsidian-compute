map $http_referer $referrer_origin {
  default "-";
  "~*^(?<public_origin>https?://[^/?#]+)" $public_origin;
}
log_format storefront '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$referrer_origin" "$http_user_agent"';

server {
  listen 80;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log storefront;
  location ~* ^/(checkout/success/?$|api/v1/checkout/receipts(?:/|$)|api/v1/auth/google/callback/?$) {
    access_log off;
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
