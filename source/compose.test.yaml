# Isolated validation stack. npm run verify selects a fresh project name.
x-test-env: &test-env
  DATABASE_URL: postgres://obsidian:local-db-password@postgres:5432/obsidian_test
  APP_BASE_URL: http://localhost:8081
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_CALLBACK_URL: ""
  ADMIN_EMAIL: admin@obsidian.local
  ADMIN_PASSWORD: ObsidianAdmin!2026
  DEMO_PAYMENT_ENABLED: "true"
  SEED_DEMO_DATA: "true"
services:
  postgres:
    environment:
      POSTGRES_DB: obsidian_test
    ports: !override
      - "127.0.0.1:15433:5432"
  init:
    environment: *test-env
  api-a:
    environment: *test-env
    ports:
      - "127.0.0.1:3101:3000"
  api-b:
    environment: *test-env
    ports:
      - "127.0.0.1:3102:3000"
  worker:
    environment:
      <<: *test-env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      MAIL_FROM: ""
  nginx:
    ports: !override
      - "127.0.0.1:8081:80"
  mailpit:
    ports: !override
      - "127.0.0.1:8026:8025"
