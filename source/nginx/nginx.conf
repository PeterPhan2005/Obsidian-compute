events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  map $uri $log_request {
    default 1;
    ~*^/api/v1/auth/google/callback/?$ 0;
  }
  map $log_request $referrer_policy {
    1 same-origin;
    0 no-referrer;
  }
  access_log /var/log/nginx/access.log combined if=$log_request;
  upstream api { server api-a:3000; server api-b:3000; }
  server {
    listen 80;
    client_max_body_size 6m;
    add_header Referrer-Policy $referrer_policy always;
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
    }
    location /media/ { alias /media/; expires 1d; add_header X-Content-Type-Options nosniff; }
    location / { proxy_pass http://frontend:80; proxy_set_header Host $http_host; }
  }
}
