events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  map $uri $log_request {
    default 1;
    ~*^/api/v1/auth/google/callback/?$ 0;
    ~*^/oauth/google/?$ 0;
    ~*^/checkout/success/?$ 0;
    ~*^/reset-password/?$ 0;
    ~*^/api/v1/checkout/receipts(?:/|$) 0;
  }
  map $log_request $referrer_policy {
    1 same-origin;
    0 no-referrer;
  }
  # Retain the referring origin without logging paths or query parameters.
  map $http_referer $referrer_origin {
    default "-";
    "~*^(?<public_origin>https?://[^/?#]+)" $public_origin;
  }
  log_format storefront '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$referrer_origin" "$http_user_agent"';
  access_log /var/log/nginx/access.log storefront if=$log_request;
  upstream api {
    zone core_api 64k;
    resolver 127.0.0.11 valid=1s ipv6=off;
    server api-a:3000 resolve;
    server api-b:3000 resolve;
  }
  server {
    listen 8082;
    location /internal/realtime/products/ { proxy_pass http://api; }
    location / { return 404; }
  }
  server {
    listen 80;
    client_max_body_size 6m;
    add_header Referrer-Policy $referrer_policy always;
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      location ~* ^/api/v1/checkout/receipts(?:/|$) {
        # Nginx error messages can include the original legacy request line.
        error_log /dev/null;
        proxy_pass http://api;
      }
    }
    location ~* ^/(checkout/success|reset-password)/?$ {
      # Legacy links can still carry a credential in the query.
      error_log /dev/null;
      proxy_pass http://frontend:80;
      proxy_set_header Host $http_host;
      proxy_hide_header Referrer-Policy;
    }
    location /socket.io/ {
      resolver 127.0.0.11 valid=1s ipv6=off;
      set $realtime realtime:3000;
      proxy_pass http://$realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
    }
    location = /internal { return 404; }
    location /internal/ { return 404; }
    location /media/ { alias /media/; expires 1d; add_header X-Content-Type-Options nosniff; }
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $http_host;
      proxy_hide_header Referrer-Policy;
    }
  }
}
